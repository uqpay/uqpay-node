name: Release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify release tag and version
        if: github.event_name != 'pull_request'
        run: node scripts/check-release-version.mjs --tag "$RELEASE_TAG"

      - name: Verify tag commit is on main
        if: github.event_name != 'pull_request'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          TAG_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
          test "$(git rev-parse HEAD)" = "$TAG_SHA"
          git merge-base --is-ancestor "$TAG_SHA" origin/main

      - name: Install dependencies
        run: npm ci

      - name: Audit critical dependencies
        run: npm audit --audit-level=critical

      - name: Run source typecheck
        run: npm run typecheck

      - name: Run test typecheck
        run: npm run test:types

      - name: Run full test suite
        run: npm test

      - name: Build package
        run: npm run build

      - name: Dry-run npm package
        run: npm pack --dry-run --json

      - name: Verify artifact version
        if: github.event_name != 'pull_request'
        run: |
          node scripts/check-release-version.mjs --tag "$RELEASE_TAG" --dist dist
          mkdir -p release-artifacts
          npm pack --pack-destination release-artifacts --json > release-artifacts/pack.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('release-artifacts/pack.json'))[0]; const v=require('./package.json').version; if(p.version!==v) throw new Error('packed version '+p.version+' != '+v)"

      - uses: actions/upload-artifact@v4
        if: matrix.node-version == '22' && github.event_name != 'pull_request'
        with:
          name: npm-package
          path: release-artifacts/*.tgz
          if-no-files-found: error

  publish-npm:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release-artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Check whether npm version already exists
        id: registry
        run: |
          VERSION="${RELEASE_TAG#v}"
          if npm view "@uqpay/sdk@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.registry.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish release-artifacts/*.tgz --access public
