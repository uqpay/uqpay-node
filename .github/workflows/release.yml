name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify release tag and version
        run: node scripts/check-release-version.mjs --tag "$GITHUB_REF_NAME"

      - name: Verify tag commit is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        run: npm ci

      - name: Audit critical dependencies
        run: npm audit --audit-level=critical

      - name: Run source typecheck
        run: npm run typecheck

      - name: Run test typecheck
        run: npm run test:types

      - name: Run full test suite
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify artifact version
        run: |
          node scripts/check-release-version.mjs --tag "$GITHUB_REF_NAME" --dist dist
          mkdir -p .release-artifacts
          npm pack --pack-destination .release-artifacts --json > .release-artifacts/pack.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('.release-artifacts/pack.json'))[0]; const v=require('./package.json').version; if(p.version!==v) throw new Error('packed version '+p.version+' != '+v)"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: .release-artifacts/*.tgz
          if-no-files-found: error

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: .release-artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check whether npm version already exists
        id: registry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@uqpay/sdk@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.registry.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish .release-artifacts/*.tgz --access public
