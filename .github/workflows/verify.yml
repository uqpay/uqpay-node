name: Verify only

# Branch pushes validate before a PR exists. No tag trigger or publishing jobs.
on:
  push:
    branches:
      - 'marshall/api-delivery/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_mode:
        type: boolean
        default: false
      release_tag:
        type: string
        default: ''

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: ${{ inputs.release_mode }}
          ref: ${{ inputs.release_mode && inputs.release_tag || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify release tag and version
        if: inputs.release_mode
        run: node scripts/check-release-version.mjs --tag "$RELEASE_TAG"

      - name: Verify tag commit is on main
        if: inputs.release_mode
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          TAG_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
          test "$(git rev-parse HEAD)" = "$TAG_SHA"
          git merge-base --is-ancestor "$TAG_SHA" origin/main

      - name: Install dependencies
        run: npm ci

      - name: Audit critical dependencies
        run: npm audit --audit-level=critical

      - name: Run source typecheck
        run: npm run typecheck

      - name: Run test typecheck
        run: npm run test:types

      - name: Run full test suite
        run: npm test

      - name: Build package
        run: npm run build

      - name: Dry-run npm package
        run: npm pack --dry-run --json

      - name: Verify artifact version
        if: inputs.release_mode
        run: |
          node scripts/check-release-version.mjs --tag "$RELEASE_TAG" --dist dist
          mkdir -p release-artifacts
          npm pack --pack-destination release-artifacts --json > release-artifacts/pack.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('release-artifacts/pack.json'))[0]; const v=require('./package.json').version; if(p.version!==v) throw new Error('packed version '+p.version+' != '+v)"

      - uses: actions/upload-artifact@v4
        if: matrix.node-version == '22' && inputs.release_mode
        with:
          name: npm-package
          path: release-artifacts/*.tgz
          if-no-files-found: error
